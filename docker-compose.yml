version: "3.8"

services:
  envsync-db:
    image: postgres:15-alpine
    container_name: envsync-db
    environment:
      - POSTGRES_USER=envsync_admin
      - POSTGRES_PASSWORD=envsync_password
      - POSTGRES_DB=envsync
    ports:
      - "5432:5432"
    volumes:
      - envsync-db-data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U envsync_admin -d envsync" ]
      interval: 5s
      timeout: 5s
      retries: 5

  envsync-backend:
    build:
      context: ./WebService
      dockerfile: Dockerfile
    container_name: envsync-backend
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://envsync_admin:envsync_password@envsync-db:5432/envsync
    depends_on:
      envsync-db:
        condition: service_healthy

  envsync-frontend:
    build:
      context: ./Client
      dockerfile: Dockerfile
    container_name: envsync-frontend
    ports:
      - "5173:5173"
    depends_on:
      - envsync-backend

volumes:
  envsync-db-data:
