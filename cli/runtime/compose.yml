name: envsync
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: envsync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Missing database credential}
      POSTGRES_DB: envsync
    volumes: [data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, "pg_isready -U envsync -d envsync"], interval: 3s, timeout: 5s, retries: 30}
    networks: [backend]
    restart: unless-stopped
    logging: *logging
  api:
    image: ${ENVSYNC_API_IMAGE:?No API runtime image configured}
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://envsync:${POSTGRES_PASSWORD}@db:5432/envsync
      JWT_SECRET: ${JWT_SECRET:?Missing session key}
      ENVSYNC_MASTER_KEY: ${ENVSYNC_MASTER_KEY:?Missing encryption key}
      PUBLIC_URL: http://localhost:${ENVSYNC_PORT}
      CORS_ORIGINS: http://localhost:${ENVSYNC_PORT},http://127.0.0.1:${ENVSYNC_PORT}
      TRUST_PROXY: "true"
    depends_on: {db: {condition: service_healthy}}
    healthcheck: {test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/ready').then(r=>{if(!r.ok)process.exit(1)})"], interval: 3s, timeout: 5s, retries: 30}
    networks: [backend, frontend]
    restart: unless-stopped
    logging: *logging
  web:
    image: ${ENVSYNC_WEB_IMAGE:?No console runtime image configured}
    ports: ["127.0.0.1:${ENVSYNC_PORT}:80"]
    depends_on: {api: {condition: service_healthy}}
    healthcheck: {test: [CMD, wget, --spider, -q, "http://127.0.0.1/"], interval: 3s, timeout: 5s, retries: 30}
    networks: [frontend]
    restart: unless-stopped
    logging: *logging
networks:
  backend: {internal: true}
  frontend: {}
volumes:
  data: {}
